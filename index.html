<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tic Tac Toe AI</title>

<style>
:root {
  --cell-size: 90px;
  --x-color: #2563eb;
  --o-color: #dc2626;
}

body {
  margin: 0;
  min-height: 100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:system-ui,sans-serif;
  background:#f8fafc;
}

h1 {
  margin-bottom:10px;
}

.status {
  font-size:22px;
  margin:15px;
}

.score {
  display:flex;
  gap:30px;
  margin-bottom:20px;
  font-size:18px;
}

.board {
  display:grid;
  grid-template-columns:repeat(3,var(--cell-size));
  gap:8px;
}

.cell {
  width:var(--cell-size);
  height:var(--cell-size);
  background:white;
  border:2px solid #333;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:55px;
  cursor:pointer;
  border-radius:12px;
  transition:.2s;
}

.cell:hover {
  background:#e2e8f0;
}

.x {
  color:var(--x-color);
}

.o {
  color:var(--o-color);
}

.win {
  background:#86efac;
}

button {
  margin-top:25px;
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#2563eb;
  color:white;
}

@media(max-width:500px){
  :root{
    --cell-size:70px;
  }
}
</style>
</head>


<body>

<h1>🧑‍💻 Tic Tac Toe AI 🤖</h1>

<div class="score">
<div>Human: <span id="humanScore">0</span></div>
<div>Robot: <span id="robotScore">0</span></div>
</div>

<div class="status" id="status">
Your turn
</div>


<div class="board" id="board"></div>

<button onclick="restart()">Restart Game</button>


<script>

const HUMAN="X";
const ROBOT="O";

let board=[];
let humanScore=0;
let robotScore=0;
let gameActive=true;


const boardElement=document.getElementById("board");
const status=document.getElementById("status");


const wins=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];


function startGame(){

board=[
"",
"",
"",
"",
"",
"",
"",
"",
""
];

gameActive=true;

render();

status.textContent="Your turn";

}


function render(){

boardElement.innerHTML="";

board.forEach((value,index)=>{

const cell=document.createElement("div");

cell.className="cell";

cell.textContent=value;

if(value==="X")
cell.classList.add("x");

if(value==="O")
cell.classList.add("o");


cell.onclick=()=>humanMove(index);

boardElement.appendChild(cell);

});

}



function humanMove(index){

if(!gameActive || board[index])
return;


board[index]=HUMAN;

render();


if(checkEnd(HUMAN))
return;


setTimeout(robotMove,400);

}



function robotMove(){

let move=findBestMove();

board[move]=ROBOT;

render();


if(checkEnd(ROBOT))
return;

status.textContent="Your turn";

}



function findBestMove(){

// Try winning move
for(let i=0;i<9;i++){

if(board[i]===""){

board[i]=ROBOT;

if(checkWinner(ROBOT)){
board[i]="";
return i;
}

board[i]="";

}

}


// Block human
for(let i=0;i<9;i++){

if(board[i]===""){

board[i]=HUMAN;

if(checkWinner(HUMAN)){
board[i]="";
return i;
}

board[i]="";

}

}


// Prefer center

if(board[4]==="")
return 4;


// Random available

let available=
board
.map((v,i)=>v===""?i:null)
.filter(v=>v!==null);


return available[
Math.floor(Math.random()*available.length)
];

}




function checkWinner(player){

return wins.some(combo=>
combo.every(i=>board[i]===player)
);

}



function checkEnd(player){

if(checkWinner(player)){

highlightWinner();

if(player===HUMAN){

status.textContent="🎉 You win!";
humanScore++;

}
else{

status.textContent="🤖 Robot wins!";
robotScore++;

}


updateScore();

gameActive=false;

return true;

}


if(!board.includes("")){

status.textContent="Draw!";

gameActive=false;

return true;

}


return false;

}



function highlightWinner(){

wins.forEach(combo=>{

if(combo.every(i=>board[i])){

if(
board[combo[0]]===
board[combo[1]] &&
board[combo[1]]===
board[combo[2]]
){

combo.forEach(i=>
boardElement.children[i]
.classList.add("win")
);

}

}

});

}



function updateScore(){

document.getElementById("humanScore").textContent=humanScore;

document.getElementById("robotScore").textContent=robotScore;

}



function restart(){

startGame();

}


startGame();

</script>

</body>
</html>
